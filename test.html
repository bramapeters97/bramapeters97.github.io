<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hamburger Test</title>
  <style>
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      box-shadow: 0 2px 20px rgba(40,50,100,0.13);
      padding: 0.5rem 2.5vw 0.5rem 2vw;
      font-family: 'Ubuntu', sans-serif;
      position: sticky;
      top: 0;
      z-index: 1000;
      min-height: 54px;
    }
    .navbar-hamburger {
      display: none;
      flex-direction: column;
      cursor: pointer;
      width: 32px;
      height: 32px;
      justify-content: center;
      align-items: center;
    }
    .navbar-hamburger span {
      width: 24px;
      height: 3px;
      background: #2d3347;
      margin: 3px 0;
      border-radius: 2px;
      transition: all 0.3s;
    }
    .navbar-menu {
      display: flex;
      gap: 2.2rem;
      align-items: center;
      transition: none;
    }
    @media (max-width: 820px) {
      .navbar-menu {
        position: fixed;
        right: 0;
        top: 0;
        height: 100vh;
        background: #fff;
        box-shadow: -2px 0 16px rgba(70,90,140,0.10);
        flex-direction: column;
        align-items: flex-start;
        padding: 100px 32px 32px 32px;
        width: 220px;
        gap: 1.4rem;
        z-index: 1500;
        transform: translateX(100%);
        transition: transform 0.33s cubic-bezier(.61,.01,.31,1.08);
      }
      .navbar-hamburger {
        display: flex;
        margin-left: 12px;
      }
    }
    #nav-toggle:checked ~ .navbar-menu {
      transform: translateX(0);
    }
    #nav-toggle:checked + label.navbar-hamburger span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }
    #nav-toggle:checked + label.navbar-hamburger span:nth-child(2) {
      opacity: 0;
    }
    #nav-toggle:checked + label.navbar-hamburger span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a class="navbar-logo" href="#">Bram Peters</a>
    <input type="checkbox" id="nav-toggle" style="display:none;">
    <label for="nav-toggle" class="navbar-hamburger">
      <span></span><span></span><span></span>
    </label>
    <div class="navbar-menu">
      <a href="#">Portfolio</a>
      <a href="#">LinkedIn</a>
      <a href="#">Contact Me</a>
    </div>
  </nav>
</body>
</html>
