<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Translation training</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f4f0; color: #191919; }
    main { width: min(38rem, calc(100% - 2rem)); padding: 2rem; border-radius: 1rem; background: white; box-shadow: 0 1rem 3rem #0001; }
    fieldset { margin: 1.5rem 0; padding: 0; border: 0; }
    legend, label { font-weight: 650; }
    .choice { display: block; margin-block: .75rem; padding: 1rem; border: 1px solid #bbb; border-radius: .5rem; font-weight: 400; }
    input[type="text"], textarea { box-sizing: border-box; width: 100%; margin-top: .5rem; padding: .75rem; font: inherit; }
    .hint { margin-top: .35rem; color: #666; font-size: .9rem; }
    button { padding: .75rem 1.25rem; border: 0; border-radius: 2rem; background: #222; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>Choose the best translation</h1>
    <form id="translation-form">
      <fieldset>
        <legend>Which translation works best?</legend>
        <label class="choice"><input type="radio" name="translation" value="first"> The first translation</label>
        <label class="choice"><input type="radio" name="translation" value="second"> The second translation</label>
      </fieldset>

      <label for="alternative">Or suggest a better alternative</label>
      <input id="alternative" name="alternative" type="text" autocomplete="off">

      <p>
        <label for="reason">What makes this one better? <span class="hint">(optional)</span></label>
        <textarea id="reason" name="reason" rows="4"></textarea>
      </p>

      <button type="submit">Continue</button>
      <p id="status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.querySelector('#translation-form');
    const alternative = document.querySelector('#alternative');
    const status = document.querySelector('#status');

    function hasAnswer() {
      return Boolean(form.elements.translation.value || alternative.value.trim());
    }

    function continueToNext() {
      if (!hasAnswer()) {
        status.textContent = 'Select a translation or enter a better alternative first.';
        return;
      }

      status.textContent = 'Answer saved. Loading the next translation…';
      form.dispatchEvent(new CustomEvent('translation:continue', {
        bubbles: true,
        detail: Object.fromEntries(new FormData(form))
      }));
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      continueToNext();
    });

    form.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || event.shiftKey || event.target.matches('textarea')) return;
      if (!hasAnswer()) return;

      event.preventDefault();
      form.requestSubmit();
    });
  </script>
</body>
</html>
