<body>


  <div class="page-wrapper">
  <header>
    <div class="nav-wrap">
      <img src="img/Logo/logo_oneline.png" style="height: 70px" />
      <nav>
        <ul>
          <li><a href="#products">Products</a></li>
          <li><a href="#how">How it works</a></li>
          <li><a href="#who">Who we are</a></li>
          <li><a href="#pricing">Pricing</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <div class="metro-lines">
      <svg viewBox="0 0 800 800">
        <!-- Solid geometric lines -->
        <polyline class="line red"    points="50 100 300 100 550 300 700 450 800 650"/>
        <polyline class="line blue"   points="0 450 150 450 300 300 450 150 650 150 800 300"/>
        <polyline class="line yellow" points="100 800 100 650 300 450 500 450 650 600 800 600"/>
        <polyline class="line green"  points="400 0 400 200 200 400 200 650 350 800"/>
        <!-- Intersection dots -->
        <circle class="station" cx="300" cy="100" r="8"/>
        <circle class="station" cx="300" cy="300" r="8"/>
        <circle class="station" cx="550" cy="300" r="8"/>
        <circle class="station" cx="500" cy="450" r="8"/>
        <circle class="station" cx="650" cy="150" r="8"/>
        <circle class="station" cx="650" cy="600" r="8"/>
        <circle class="station" cx="400" cy="200" r="8"/>
        <circle class="station" cx="200" cy="400" r="8"/>
      </svg>
    </div>
    <div class="card">
      <div class="card-logo">
        <img src="img/ConceptArt/train.png">
      </div>
      <div class="form">
      <form onsubmit="event.preventDefault();alert('Prototype: Map generation coming soon!');">
        <input type="text" placeholder="📍 Destination City (e.g. Oslo)" required id="city-input">
        <div id="city-suggestions"></div>
        <button type="submit" id="submit">Next</button>
      </form>
      </div>
    </div>
  </main>
  </div>
