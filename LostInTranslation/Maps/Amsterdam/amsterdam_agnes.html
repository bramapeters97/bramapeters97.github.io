<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map Poster — Stokhollum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Clean, modern face for title; thinner handwritten for signature -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;700&family=Reenie+Beanie&display=swap" rel="stylesheet">

  <style>
    /* ---- PRINT SETUP ---- */
    @page { size: A3 portrait; margin: 0; }

    :root{
      --m-left: 10%;
      --m-right: 10%;
      --m-top: 10%;
      --m-bottom: 15%; /* decreased from 30% */
    }

    /* Reset */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: #000;
      -webkit-font-smoothing: antialiased;
      font-smooth: always;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
                   "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    /* A3 portrait canvas: 297 × 420 mm */
    .poster {
      width: 297mm;
      height: 420mm;
      margin: 0 auto;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    /* ---- MAP AREA (replaces the placeholder with an iframe) ---- */
    .map-frame {
      position: absolute;
      left: var(--m-left);
      right: var(--m-right);
      top: var(--m-top);
      bottom: var(--m-bottom);
      background: #e8e8e8;              /* keep the original neutral surface */
      border: 1px solid #bdbdbd;        /* keep the original border */
      overflow: hidden;                  /* hide any overflow while scaling */
    }

    /* The iframe will be absolutely centered and scaled via transform */
    .map-frame > iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      border: none;
      transform-origin: top left;  /* so translate(-50%, -50%) + scale works predictably */
      /* Width and height will be set dynamically by JS to the iframe content size */
      /* transform will also be set dynamically by JS */
      background: transparent;
      display: block;
    }

    /* ---- TITLE BLOCK (centered below map) ---- */
    .title {
      position: absolute;
      left: 8%;
      right: 8%;
      top: calc(100% - var(--m-bottom) + 1%);
      text-align: center;
      letter-spacing: .08em;
      font-family: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .city {
      font-weight: 300;
      font-size: clamp(21pt, 8.3vw, 50pt);
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 1em;
    }
    .subtitle {
      display: block;
      margin-top: .3em;
      font-weight: 200;
      font-size: clamp(11pt, 2.9vw, 18pt);
      text-transform: lowercase;
      letter-spacing: 0.1em;
    }

    /* ---- LOWER CORNER ELEMENTS (horizontal, positioned below title) ---- */
    .brand, .signature {
      position: absolute;
      bottom: 2.5%;
      max-width: 22%;
      line-height: 1.25;
      letter-spacing: .04em;
    }

    /* Lower-left brand block (≈10% width visually) */
    .brand {
      left: var(--m-left);
      width: 10%;
      min-width: 90px;
      text-align: left;
    }
    .brand .name {
      font-weight: 500;
      font-size: clamp(8pt, 1.6vw, 12pt);
    }
    .brand .slogan {
      margin-top: .3em;
      font-weight: 300;
      font-size: clamp(6pt, 1.3vw, 9pt);
      opacity: .95;
    }

    /* Lower-right signature */
    .signature {
      right: var(--m-right);
      text-align: right;
      font-family: "Reenie Beanie", cursive; /* thinner, authentic hand */
      font-weight: 400;
      font-size: clamp(12pt, 3.2vw, 22pt);
      letter-spacing: 0.8;
      white-space: nowrap;
    }

    /* Screen helper — center the poster on page */
    @media screen {
      body { display: grid; place-items: center; padding: 2rem; background: #fafafa; }
      .shadow { box-shadow: 0 12px 40px rgba(0,0,0,.08), 0 2px 10px rgba(0,0,0,.06); }
    }
  </style>
</head>
<body>
  <main class="poster shadow" role="img" aria-label="A3 poster template with embedded Amsterdam map">
    <!-- Map area (iframe replaces the original placeholder; same size and margins) -->
    <div class="map-frame" id="mapFrame">
      <iframe id="mapIframe" src="amsterdam_dieter.html" scrolling="no" title="Amsterdam map by Dieter"></iframe>
      <noscript>
        <style>
          /* Fallback if JS is disabled: make iframe stretch to container */
          #mapIframe { position: static; width: 100%; height: 100%; transform: none !important; }
        </style>
      </noscript>
    </div>

    <!-- Title block -->
    <div class="title" aria-labelledby="city subtitle">
      <div id="city" class="city">AMSTERDAM</div>
      <span id="subtitle" class="subtitle">spoorkaart</span>
    </div>

    <!-- Lower-left brand (horizontal, under the title) -->
    <div class="brand" aria-label="Brand">
      <div class="name">Lost In Translation</div>
      <div class="slogan">Global Transit, Local Nonsense</div>
    </div>

    <!-- Lower-right signature (horizontal, under the title) -->
    <div class="signature" aria-label="Signature">by Gerrit</div>
  </main>

  <script>
    (function () {
      const frame = document.getElementById('mapFrame');
      const iframe = document.getElementById('mapIframe');

      function fitIframe() {
        if (!iframe.contentWindow) return;

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc) return;

        // Try to detect intrinsic content size inside the iframe
        // Priority: SVG viewBox -> SVG bounding box -> document dimensions
        let intrinsicWidth = 0;
        let intrinsicHeight = 0;

        const svg = doc.querySelector('svg');
        if (svg) {
          try {
            if (svg.viewBox && svg.viewBox.baseVal && svg.viewBox.baseVal.width && svg.viewBox.baseVal.height) {
              intrinsicWidth  = svg.viewBox.baseVal.width;
              intrinsicHeight = svg.viewBox.baseVal.height;
            } else {
              const r = svg.getBoundingClientRect();
              intrinsicWidth  = r.width  || svg.clientWidth  || svg.scrollWidth  || 1000;
              intrinsicHeight = r.height || svg.clientHeight || svg.scrollHeight || 1000;
            }
          } catch(e) {
            // Fallback to document metrics
          }
        }

        if (!intrinsicWidth || !intrinsicHeight) {
          // Fallback: use document element or body scroll size
          const de = doc.documentElement;
          const b  = doc.body;
          intrinsicWidth  = Math.max(de.scrollWidth,  b ? b.scrollWidth  : 0, de.clientWidth);
          intrinsicHeight = Math.max(de.scrollHeight, b ? b.scrollHeight : 0, de.clientHeight);
        }

        // Container size (the placeholder box)
        const cw = frame.clientWidth;
        const ch = frame.clientHeight;

        // Compute scale to fit while preserving aspect ratio
        const scale = Math.max(0.0001, Math.min(cw / intrinsicWidth, ch / intrinsicHeight));

        // Apply exact pixel size of the content to the iframe, then scale and center it
        iframe.style.width  = intrinsicWidth + 'px';
        iframe.style.height = intrinsicHeight + 'px';
        iframe.style.transform = 'translate(-50%, -50%) scale(' + scale + ')';
      }

      // Fit when iframe loads and on window resize
      iframe.addEventListener('load', fitIframe, { once: false });
      window.addEventListener('resize', fitIframe);

      // In case fonts/layout inside the iframe shift after load
      setTimeout(fitIframe, 300);
      setTimeout(fitIframe, 800);
    })();
  </script>
</body>
</html>
