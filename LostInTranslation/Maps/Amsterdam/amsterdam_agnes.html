<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Map Poster — Stokhollum</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    /* ---- PRINT SETUP ---- */
    @page { size: A3 portrait; margin: 0; }

    :root{
      --m-left: 10%;
      --m-right: 10%;
      --m-top: 10%;
      --m-bottom: 30%;
      --footer-top: calc(100% - var(--m-bottom) + 2.2%);
    }

    /* Reset */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: #000;
      -webkit-font-smoothing: antialiased;
      font-smooth: always;
      /* Clean, modern system font stack */
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji",
                   "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
    }

    /* A3 portrait canvas: 297 × 420 mm */
    .poster {
      width: 297mm;
      height: 420mm;
      margin: 0 auto;
      position: relative;
      background: #fff;
      overflow: hidden;
    }

    /* ---- MAP PLACEHOLDER ---- */
    .map-placeholder {
      position: absolute;
      left: var(--m-left);
      right: var(--m-right);
      top: var(--m-top);
      bottom: var(--m-bottom);
      background: #e8e8e8;
      border: 1px solid #bdbdbd;
    }
    .map-placeholder::before,
    .map-placeholder::after{
      content: "";
      position: absolute;
      inset: 12% 12%;
      border: 1px dashed #bdbdbd;
    }
    .map-placeholder::after{
      inset: 0;
      background:
        linear-gradient( to bottom right, transparent 49.5%, #cfcfcf 49.5%, #cfcfcf 50.5%, transparent 50.5%),
        linear-gradient( to top right, transparent 49.5%, #cfcfcf 49.5%, #cfcfcf 50.5%, transparent 50.5%);
      opacity: .35;
    }

    /* ---- TITLE BLOCK (centered below map) ---- */
    .title {
      position: absolute;
      left: 8%;
      right: 8%;
      top: calc(100% - var(--m-bottom) + 1%);
      text-align: center;
      letter-spacing: .12em;
    }
    .city {
      font-weight: 300;
      font-size: clamp(16pt, 6.4vw, 38pt);
      line-height: 1.15;
      text-transform: uppercase;
    }
    .subtitle {
      display: block;
      margin-top: .25em;
      font-weight: 200;
      font-size: clamp(8pt, 2.2vw, 14pt);
      letter-spacing: .22em;
      text-transform: lowercase;
    }

    /* ---- BRAND (bottom-left) ---- */
    .brand {
      position: absolute;
      left: var(--m-left);
      top: var(--footer-top);
      width: 10%;
      min-width: 80px;
      line-height: 1.25;
    }
    .brand .name {
      font-weight: 400;
      font-size: clamp(8pt, 1.6vw, 12pt);
      letter-spacing: .06em;
    }
    .brand .slogan {
      margin-top: .35em;
      font-weight: 300;
      font-size: clamp(6pt, 1.3vw, 9pt);
      letter-spacing: .12em;
      opacity: .95;
    }

    /* ---- SIGNATURE (bottom-right) ---- */
    .signature {
      position: absolute;
      right: var(--m-right);
      top: var(--footer-top);
      /* Handwritten-feel without external fonts */
      font-family: "Bradley Hand", "Segoe Print", "Comic Sans MS", "Apple Chancery",
                   "Snell Roundhand", cursive;
      font-weight: 600;
      font-size: clamp(14pt, 3.6vw, 24pt);
      transform: translateY(-0.15em);
      white-space: nowrap;
    }

    /* Screen helper — center the poster on page */
    @media screen {
      body { display: grid; place-items: center; padding: 2rem; background: #fafafa; }
      .shadow { box-shadow: 0 12px 40px rgba(0,0,0,.08), 0 2px 10px rgba(0,0,0,.06); }
    }
  </style>
</head>
<body>
  <main class="poster shadow" role="img" aria-label="A3 poster template with map placeholder and typographic layout">
    <!-- Map area (no actual map: just a placeholder rectangle) -->
    <div class="map-placeholder" aria-hidden="true"></div>

    <!-- Title block -->
    <div class="title" aria-labelledby="city subtitle">
      <div id="city" class="city">STOKHOLLUM</div>
      <span id="subtitle" class="subtitle">spoorkaart</span>
    </div>

    <!-- Lower-left brand -->
    <div class="brand" aria-label="Brand">
      <div class="name">Lost In Translation</div>
      <div class="slogan">Global Transit, Local Nonsense</div>
    </div>

    <!-- Lower-right signature -->
    <div class="signature" aria-label="Signature">by Gerrit</div>
  </main>
</body>
</html>
