<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lost In Translation — Persona Signatures (All Effects Applied)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&family=Pacifico&family=Parisienne&family=Patrick+Hand+SC&family=Handlee&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f7f7f7;
      --ink: #111;
      --muted: #777;
      --dash: rgba(0,0,0,.08);
    }

    body{
      margin:0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 4rem 1.25rem;
    }

    .sheet{
      width: min(820px, 92vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(0,0,0,.06);
    }

    h1{
      font-size: clamp(18px, 3vw, 24px);
      margin: 0 0 1.25rem 0;
      letter-spacing: .02em;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .siglist{
      display:flex;
      flex-direction:column;
      gap: clamp(18px, 3.5vh, 28px);
    }

    .sig{
      line-height: 1;
      display:flex;
      align-items:flex-end;
      gap: 1rem;
      position: relative;
      padding-bottom: .25rem;
    }

    .sig::after{
      content:"";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      border-bottom: 1px dashed var(--dash);
    }

    .sig .text{
      display:inline-block;
      font-size: clamp(36px, 7vw, 56px);
      transform-origin: left center;
      white-space: nowrap;
    }

    /* Fonts per persona */
    .karen .text{ font-family: "Pacifico", cursive; }
    .clemence .text{ font-family: "Parisienne", cursive; }
    .agnes .text{ font-family: "Kalam", sans-serif; }
    .dieter .text{ font-family: "Patrick Hand SC", sans-serif; text-transform: uppercase; }
    .gerrit .text{ font-family: "Handlee", cursive; }

    /* Per-letter jitter & ink variation */
    .glyph{
      display: inline-block;
      transform-origin: center;
      transform:
        translate(var(--tx, 0), calc(var(--ty, 0) + var(--basey, 0px)))
        rotate(var(--rot, 0));
      text-shadow: var(--shadow);
      color: var(--ink-color, #111);
    }

    .glyph.space{
      transform: none !important;
      text-shadow: none !important;
      width: 0.32em;
    }

    @media (prefers-reduced-motion: reduce) {
      .glyph { transform: none !important; }
    }

    .label{
      font-size: 12px;
      color: var(--muted);
      margin-top: .4rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>Persona Signatures</h1>
    <section class="siglist">
      <div class="sig karen" data-jitter="letters" data-amp="0.55" data-rotate="0.9" data-thick="0.5" data-ink-var="14" data-wave="1.2" data-cycles="1">
        <span class="text">by Karen</span>
      </div>
      <div class="label">Bubbly handwritten — humanized</div>

      <div class="sig clemence" data-jitter="letters" data-amp="0.50" data-rotate="0.8" data-thick="0.5" data-ink-var="12" data-wave="1.0" data-cycles="1.1">
        <span class="text">by Clémence</span>
      </div>
      <div class="label">Elegant, connected handwriting — humanized</div>

      <div class="sig agnes" data-jitter="letters" data-amp="0.55" data-rotate="0.9" data-thick="0.5" data-ink-var="15" data-wave="1.2" data-cycles="1.15">
        <span class="text">by Agnes</span>
      </div>
      <div class="label">Neutral, modern, clean — humanized</div>

      <div class="sig dieter" data-jitter="letters" data-amp="0.45" data-rotate="0.7" data-thick="0.5" data-ink-var="12" data-wave="0.9" data-cycles="0.9">
        <span class="text">by Dieter</span>
      </div>
      <div class="label">Block-lettered, functional — humanized</div>

      <div class="sig gerrit" data-jitter="letters" data-amp="0.50" data-rotate="0.8" data-thick="0.5" data-ink-var="18" data-wave="1.4" data-cycles="1.25">
        <span class="text">by Gerrit</span>
      </div>
      <div class="label">Boring, practical — humanized</div>
    </section>
  </main>

  <script>
    (function(){
      const texts = document.querySelectorAll('.sig[data-jitter="letters"] .text');

      texts.forEach(textEl => {
        const sig = textEl.closest('.sig');
        const amp   = parseFloat(sig.getAttribute('data-amp')   || '0.5');
        const rot   = parseFloat(sig.getAttribute('data-rotate')|| '0.8');
        const thick = parseFloat(sig.getAttribute('data-thick') || '0.4');
        const inkV  = parseFloat(sig.getAttribute('data-ink-var') || '15');
        const waveA = parseFloat(sig.getAttribute('data-wave')   || '0');
        const cycles= parseFloat(sig.getAttribute('data-cycles') || '1');
        const phase = Math.random() * Math.PI * 2;

        const raw = textEl.textContent;
        const frag = document.createDocumentFragment();
        textEl.textContent = '';

        const letters = [...raw].filter(ch => ch !== ' ');
        const N = Math.max(letters.length, 1);
        let idxNonSpace = 0;

        for (let ch of raw){
          const span = document.createElement('span');
          span.className = 'glyph';

          if (ch === ' ') {
            span.classList.add('space');
            span.textContent = ' ';
            frag.appendChild(span);
            continue;
          }

          const t = idxNonSpace / Math.max(N - 1, 1);
          const baseY = Math.sin((t * cycles * Math.PI * 2) + phase) * waveA;

          const tx = (Math.random() * 2 - 1) * amp;
          const ty = (Math.random() * 2 - 1) * amp;
          const r  = (Math.random() * 2 - 1) * rot;

          const shadowSize = (Math.random() * thick).toFixed(2);
          const shadow = `0 0 ${shadowSize}px rgba(0,0,0,0.8)`;

          const baseInk = 17;
          const varAmount = Math.round((Math.random() * 2 - 1) * inkV);
          const inkLevel = Math.max(0, Math.min(255, baseInk + varAmount));
          const inkColor = `rgb(${inkLevel},${inkLevel},${inkLevel})`;

          span.style.setProperty('--tx', tx.toFixed(2) + 'px');
          span.style.setProperty('--ty', ty.toFixed(2) + 'px');
          span.style.setProperty('--rot', r.toFixed(2) + 'deg');
          span.style.setProperty('--shadow', shadow);
          span.style.setProperty('--ink-color', inkColor);
          span.style.setProperty('--basey', baseY.toFixed(2) + 'px');

          span.textContent = ch;
          frag.appendChild(span);

          idxNonSpace++;
        }

        textEl.appendChild(frag);
      });
    })();
  </script>
</body>
</html>
