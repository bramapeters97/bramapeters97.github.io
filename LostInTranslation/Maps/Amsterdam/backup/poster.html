<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lost In Translation — Persona Signatures</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Fonts -->
  <!-- Karen: bubbly handwritten (Pacifico) -->
  <!-- Clémence: elegant, connected script (Parisienne) -->
  <!-- Agnes: neutral, modern, clean handwritten (Caveat) -->
  <!-- Dieter: block-lettered, functional handwritten (Amatic SC) -->
  <!-- Gerrit: boring, practical handwritten (Patrick Hand) -->
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Caveat:wght@400;600&family=Pacifico&family=Parisienne&family=Patrick+Hand&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: #f7f7f7;
      --ink: #111;
      --muted: #777;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 4rem 1.25rem;
    }

    .sheet{
      width: min(820px, 92vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
      padding: clamp(24px, 5vw, 48px);
      border: 1px solid rgba(0,0,0,.06);
    }

    h1{
      font-size: clamp(18px, 3vw, 24px);
      margin: 0 0 1.25rem 0;
      letter-spacing: .02em;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .siglist{
      display:flex;
      flex-direction:column;
      gap: clamp(18px, 3.5vh, 28px);
    }

    .sig{
      line-height: 1;
      display:flex;
      align-items:flex-end;
      gap: 1rem;
    }

    /* a faint baseline for alignment (optional, looks like paper) */
    .sig::after{
      content:"";
      flex:1 1 auto;
      border-bottom: 1px dashed rgba(0,0,0,.08);
      transform: translateY(-4px);
    }

    /* Signature text base */
    .sig span{
      display:inline-block;
      font-size: clamp(36px, 7vw, 56px);
      color: var(--ink);
      transform-origin: left center;
      white-space: nowrap;
    }

    /* Karen – bubbly handwritten */
    .karen span{
      font-family: "Pacifico", "Comic Sans MS", "Brush Script MT", cursive;
      letter-spacing: .02em;
      transform: rotate(-1.2deg);
    }

    /* Clémence – elegant, connected */
    .clemence span{
      font-family: "Parisienne", "Great Vibes", "Allura", cursive;
      font-size: clamp(40px, 7.5vw, 60px);
      letter-spacing: .02em;
      transform: rotate(0.4deg);
      font-weight: 400;
    }

    /* Agnes – neutral, modern, clean */
    .agnes span{
      font-family: "Caveat", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      transform: rotate(-0.3deg);
    }

    /* Dieter – block-lettered, functional */
    .dieter span{
      font-family: "Amatic SC", "Patrick Hand", "Arial Black", Impact, sans-serif;
      letter-spacing: .06em;
      font-weight: 700;
      transform: rotate(0deg);
      text-transform: uppercase;
      /* slightly smaller so caps don't overpower */
      font-size: clamp(34px, 6.8vw, 52px);
    }

    /* Gerrit – boring/practical handwritten */
    .gerrit span{
      font-family: "Patrick Hand", "Segoe Print", "Bradley Hand", cursive;
      letter-spacing: .005em;
      transform: rotate(0.2deg);
      font-weight: 400;
    }

    /* Small helper label under each signature for clarity (can be removed) */
    .label{
      font-size: 12px;
      color: var(--muted);
      margin-top: .4rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main class="sheet" role="main" aria-labelledby="title">
    <h1 id="title">Persona Signatures</h1>
    <section class="siglist" aria-label="Signatures">
      <div class="sig karen">
        <span>by Karen</span>
      </div>
      <div class="label">Bubbly handwritten</div>

      <div class="sig clemence">
        <span>by Clémence</span>
      </div>
      <div class="label">Elegant, connected handwriting</div>

      <div class="sig agnes">
        <span>by Agnes</span>
      </div>
      <div class="label">Neutral, modern, clean handwriting</div>

      <div class="sig dieter">
        <span>by Dieter</span>
      </div>
      <div class="label">Block-lettered, functional handwriting</div>

      <div class="sig gerrit">
        <span>by Gerrit</span>
      </div>
      <div class="label">Boring, practical handwriting</div>
    </section>
  </main>
</body>
</html>
